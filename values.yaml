# -------------------------------------------------------------------
# Airflow core
# -------------------------------------------------------------------
airflowVersion: "2.10.5"

executor: KubernetesExecutor
allowPodLaunching: true

postgresql:
  enabled: false

# -------------------------------------------------------------------
# Images
# -------------------------------------------------------------------
defaultAirflowRepository: huangyuan2000/airflow-worker-buildx
defaultAirflowTag: "2.10.5.1"
pullPolicy: Always


# -------------------------------------------------------------------
# DAGs (hostPath, no git-sync)
# -------------------------------------------------------------------
dags:
  mountPath: /opt/airflow/dags
  gitSync:
    enabled: false

volumes:
  - name: airflow-dags
    hostPath:
      path: /mnt/S/MLinfra/airflow_ml/dags
      type: Directory
  - name: git-ssh-key
    secret:
      secretName: git-ssh-secret
      defaultMode: 0400  
      items:
        - key: gitSshKey       
          path: id_ed25519
        - key: knownHosts       # <-- Fetch the pre-trusted keys
          path: known_hosts                
  - name: dvc-cache-storage
    persistentVolumeClaim:
      claimName: airflow-dvc-pvc

  # --- ADDED: Mount the host's Docker Socket ---
  - name: docker-socket
    hostPath:
      path: /var/run/docker.sock
      type: Socket       

volumeMounts:
  - name: airflow-dags
    mountPath: /opt/airflow/dags
    readOnly: true
  - name: git-ssh-key
    mountPath: /home/airflow/.ssh/
    readOnly: true    
  - name: dvc-cache-storage
    mountPath: /home/airflow/.cache/dvc 

  # --- ADDED: Expose the socket to the container ---
  - name: docker-socket
    mountPath: /var/run/docker.sock   

# -------------------------------------------------------------------
# Database (external PostgreSQL)
# -------------------------------------------------------------------
data:
  metadataConnection:
    protocol: postgresql
    host: postgres-postgresql.mlops
    port: 5432
    user: airflow_git
    pass: airflow123
    db: airflow_git
    sslmode: disable

# ----------------------------------------------------------
# webserveSecretKeySecretName  
# ----------------------------------------------------------  
webserverSecretKeySecretName: airflow-webserver-secret


# -------------------------------------------------------------------
# Webserver
# -------------------------------------------------------------------
webserver:
  replicas: 1
  defaultUser:
    enabled: true
    username: admin
    password: admin
    role: Admin
    email: yuanhuang@test.com

  service:
    type: ClusterIP
    ports:
      - name: airflow-ui
        port: 8080
# ------------------------------------------------------------------
# logs
# ------------------------------------------------------------------
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs-pvc      
# -------------------------------------------------------------------
# Scheduler
# -------------------------------------------------------------------
scheduler:
  replicas: 1

# -------------------------------------------------------------------
# Triggerer (stateless)
# -------------------------------------------------------------------
triggerer:
  enabled: true
  persistence:
    enabled: false

# -------------------------------------------------------------------
# Workers (KubernetesExecutor → stateless)
# -------------------------------------------------------------------
worker:
  persistence:
    enabled: false
    
# -------------------------------------------------------------------
# Global Environment Variables from Secrets
# -------------------------------------------------------------------
# This maps keys from your 'registry-credentials' secret directly into
# environment variables accessible by any Airflow task pod.
secretEnv:
  - name: DOCKER_USER
    secretName: registry-credentials
    secretKey: REGISTRY_USER
  - name: DOCKER_PASSWORD
    secretName: registry-credentials
    secretKey: REGISTRY_PASS